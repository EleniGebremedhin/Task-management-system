<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task management System</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <div class="app-header">
        <div>
          <h1>Task Management System</h1>
          <p>Organize your tasks and stay productive.</p>
        </div>

        <button type="button" id="theme-toggle" aria-pressed="false">
          🌙 Dark Mode
        </button>
      </div>

      <form id="task-form">
        <input
          type="text"
          id="task-input"
          placeholder="Enter a new task..."
          aria-label="New task"
        />

        <select id="task-priority" aria-label="Task priority">
          <option value="low">Low priority</option>
          <option value="medium" selected>Medium priority</option>
          <option value="high">High priority</option>
        </select>

        <select id="task-category" aria-label="Task category">
          <option value="Study">Study</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Other">Other</option>
        </select>

        <input type="date" id="task-deadline" aria-label="Task deadline" />

        <button type="submit">Add Task</button>
      </form>

      <input
        type="search"
        id="search-input"
        placeholder="Search tasks..."
        aria-label="Search tasks"
      />
      <div class="filters">
        <button type="button" data-filter="all">All</button>
        <button type="button" data-filter="pending">Pending</button>
        <button type="button" data-filter="completed">Completed</button>
      </div>
      <section class="statistics">
        <p>Total: <span id="total-count">0</span></p>
        <p>Completed: <span id="completed-count">0</span></p>
        <p>Pending: <span id="pending-count">0</span></p>
      </section>
      <ul id="task-list"></ul>
      <p id="empty-message">No tasks yet. Add your first task!</p>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
